<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redimensionador de Imagens Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.5s ease-out',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Glassmorphism utilities */
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: #e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 antialiased selection:bg-brand-500 selection:text-white">

    <div class="w-full max-w-4xl animate-fade-in">
        <!-- Header -->
        <header class="text-center mb-12">
            <h1 class="text-5xl md:text-6xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-brand-300 to-purple-400 mb-4 tracking-tight">
                Resizer Pro
            </h1>
            <p class="text-slate-400 text-lg md:text-xl font-light max-w-2xl mx-auto">
                Redimensione suas imagens com qualidade profissional e velocidade instantânea.
            </p>
        </header>

        <!-- Main Card -->
        <main class="glass-card rounded-3xl p-8 md:p-12 animate-slide-up relative overflow-hidden">
            <!-- Decorative blobs -->
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 relative z-10">
                
                <!-- Left Column: Upload & Controls -->
                <div class="space-y-8">
                    <!-- Upload Area -->
                    <div id="drop-zone" class="group relative border-2 border-dashed border-slate-600 hover:border-brand-400 rounded-2xl p-8 transition-all duration-300 ease-out cursor-pointer bg-slate-800/50 hover:bg-slate-800/80 text-center">
                        <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" accept="image/*">
                        <div class="flex flex-col items-center justify-center space-y-4">
                            <div class="w-16 h-16 rounded-full bg-slate-700 group-hover:bg-brand-500/20 flex items-center justify-center transition-colors duration-300">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400 group-hover:text-brand-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <div>
                                <p class="text-lg font-medium text-slate-200 group-hover:text-brand-300 transition-colors">Solte sua imagem aqui</p>
                                <p class="text-sm text-slate-500 mt-1">ou clique para navegar</p>
                            </div>
                        </div>
                    </div>

                    <!-- Controls (Hidden initially) -->
                    <div id="controls" class="space-y-6 opacity-50 pointer-events-none transition-all duration-300 filter blur-[2px]">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Dimensões</label>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="relative">
                                    <input type="number" id="width-input" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all text-slate-200 placeholder-slate-600" placeholder="Largura">
                                    <span class="absolute right-4 top-3.5 text-xs text-slate-500 font-mono">PX</span>
                                </div>
                                <div class="relative">
                                    <input type="number" id="height-input" class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500/50 focus:border-brand-500 transition-all text-slate-200 placeholder-slate-600" placeholder="Altura">
                                    <span class="absolute right-4 top-3.5 text-xs text-slate-500 font-mono">PX</span>
                                </div>
                            </div>
                            <div class="mt-3 flex items-center space-x-2">
                                <input type="checkbox" id="lock-aspect" checked class="w-4 h-4 rounded border-slate-600 text-brand-500 focus:ring-brand-500 bg-slate-800">
                                <label for="lock-aspect" class="text-sm text-slate-400 select-none cursor-pointer">Manter proporção</label>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Qualidade: <span id="quality-value" class="text-brand-400">90%</span></label>
                            <input type="range" id="quality-slider" min="1" max="100" value="90" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-brand-500">
                        </div>

                        <button id="download-btn" class="w-full bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-semibold py-4 rounded-xl shadow-lg shadow-brand-500/25 transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center space-x-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            <span>Baixar Imagem Redimensionada</span>
                        </button>
                    </div>
                </div>

                <!-- Right Column: Preview -->
                <div class="flex flex-col h-full">
                    <div class="flex-1 bg-slate-900/50 rounded-2xl border border-slate-700/50 p-4 flex items-center justify-center overflow-hidden relative min-h-[300px]">
                        <div id="preview-placeholder" class="text-center">
                            <div class="inline-block p-4 rounded-full bg-slate-800/50 mb-3">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                </svg>
                            </div>
                            <p class="text-slate-500 text-sm">A pré-visualização aparecerá aqui</p>
                        </div>
                        <img id="preview-img" class="max-w-full max-h-full object-contain rounded-lg shadow-2xl hidden" alt="Preview">
                    </div>
                    <div id="file-info" class="mt-4 flex justify-between text-sm text-slate-400 opacity-0 transition-opacity duration-300">
                        <span id="original-size">Original: -</span>
                        <span id="new-size" class="text-brand-400 font-medium">Novo: -</span>
                    </div>
                </div>
            </div>
        </main>
        
        <footer class="mt-12 text-center text-slate-600 text-sm">
            <p>&copy; 2025 Resizer Pro. Criado com Inteligência Artificial.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
